<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combo em Dobro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/burger_icon.png">
</head>
<body>

    <header>
        <div class="container_logo">
            <img src="img/burgerlogo.png" alt="imagem de burger">
            <p>O verdadeiro sabor na Chapa!</p>
            <nav class="menu_navegacao">
                <a href="index.html">Início</a>
            </nav>
        </div>
    </header>

    <main class="pagina_detalhes">
        <div class="wrapper_produto">
            <div class="bloco_imagem">
                <img src="img/3_combo.png" alt="Cheese Costela">
            </div>

            <div class="bloco_info">
                <h1>Combo em Dobro</h1>
                <p class="descricao_completa">
                    Green House em Dobro com Refrigerante e Batata Pequena!
                </p>
                <div class="preco_destaque">De <del>R$ 88,99</del> por R$ 71,99</div>

                <div class="secao_adicionais">
                    <h3>Deseja adicionais?</h3>
                    <label><input type="checkbox"> + Bacon Crocante (+ R$ 5,00)</label>
                    <label><input type="checkbox"> + Ovo na Chapa (+ R$ 3,00)</label>
                    <label><input type="checkbox"> + Queijo Cheddar Extra (+ R$ 4,00)</label>
                </div>

                <a href="https://wa.me/45998099475?text=Olá! Quero pedir um Combo em Dobro." target="_blank" class="btn_enviar_pedido">
                    Finalizar Pedido
                </a>
            </div>
        </div>
    </main>

    <footer>
        <div class="rodape">
            <h2>Mestre da Chapa Burger</h2>
            <p>O verdadeiro sabor na chapa!</p>
            <div class="redes">
                <a href="https://www.instagram.com/codelian_?igsh=c3BoZWp6a3o4dmVn">Instagram</a>
                <a href="https://web.whatsapp.com">WhatsApp</a>
                <a href="https://www.ifood.com.br">iFood</a>
            </div>
            <span>© 2026 Mestre da Chapa Burger</span>
        </div>
    </footer>
</body>
</html>
